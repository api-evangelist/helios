summary: >-
  helios (the French sustainable neobank at helios.do) serves NO /.well-known/ discovery
  surface on any host — no security.txt, no OIDC or OAuth authorization-server metadata, no
  api-catalog, no ai-plugin.json and no A2A agent card. Every path returns a real HTTP 404.
  The ONE machine-readable document helios publishes is /llms.txt (200, text/plain, 3,843
  bytes) — a French-language AI-usage policy telling assistants which pages are authoritative
  and which (Espace client, inscription) must not be treated as documentation. No WellKnown or
  SecurityTxt pointer is emitted, because a recorded absence is not a served surface.
notes: >-
  Control probe of https://www.helios.do/zzz-nonexistent-kin-probe-9931 returned 404, confirming
  the marketing host does not answer with a catch-all 200 — the 404s below are real. The blog
  host is the opposite case: https://blog.helios.do/ answers HTTP 200 with an HTML shell for
  EVERY path including /llms.txt, /.well-known/security.txt and /.well-known/agent-card.json
  (control: /zzz-nonexistent-kin-probe-9931 -> 200, 50,233 bytes). Those are SPA soft-404s and
  are recorded as misses, not documents. Certificate-transparency enumeration of *.helios.do
  returned app, app-dev, app-staging, backoffice, backoffice-dev, backoffice-staging, blog,
  blog-test, email, go, help and meta — and no api.* host of any kind. app.helios.do,
  backoffice.helios.do, help.helios.do and meta.helios.do do not resolve in public DNS;
  go.helios.do resolves to Firebase Hosting (199.36.158.100) and answers 400 at the root.
  robots.txt disallows /espace_client/ and /partenaire/ and those paths were not probed.
