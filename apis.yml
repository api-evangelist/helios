aid: helios
name: helios
description: >-
  helios is a French sustainable-banking company (HELIOS SAS, Paris) offering current, Premium,
  joint, youth, Liberté and independent/professional accounts, a green savings passbook, sustainable
  life insurance and wooden or recycled-plastic Visa cards through iOS, Android and web. It is a
  société à mission and a certified B Corp whose promise is that no customer euro finances fossil
  fuels or polluting industry, and it publishes the list of transition projects it funds. helios is
  registered in REGAFI under 731225 as a payment services agent of OKALI, the ACPR-approved
  electronic money institution that services the accounts. It publishes no public API, SDK, webhook
  or developer portal; the one machine-readable document it serves is an llms.txt AI-usage policy.
