    publishes no developer portal, API reference, SDK or webhook surface, and as a payment
    services agent of OKALI (REGAFI 731225) it exposes no PSD2 dedicated interface of its own;
    /openapi.json, /graphql, /mcp, /api and every /.well-known/ path return a real 404 on
    www.helios.do (a nonsense control path also 404s, so these are not soft-404s), and
    certificate-transparency enumeration of *.helios.do lists app, backoffice, blog, email, go,
    help and meta but no api.* host of any kind.
